<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lane: Six Kingdoms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--ink:#f3ead7;--dim:#a79f8e;--gold:#f0c060;--ember:#ff7a3c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Cinzel,Georgia,serif;letter-spacing:.06em}
.hero{height:100vh;height:100svh;min-height:560px;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}
.bgs{position:absolute;inset:0}
.arr{position:absolute;top:50%;z-index:3;width:64px;height:96px;margin-top:-48px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;opacity:.55;transition:opacity .3s,transform .3s}
.arr:hover{opacity:1}
.arr:focus-visible{outline:1px solid rgba(255,243,214,.6);outline-offset:2px;opacity:1}
.arr svg{width:28px;height:56px;fill:none;stroke:#fff3d6;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(0,0,0,.6))}
.arr.prev{left:max(8px,2.5vw)}.arr.next{right:max(8px,2.5vw)}
.arr.prev:hover{transform:translateX(-4px)}.arr.next:hover{transform:translateX(4px)}
@media (max-width:900px){.arr{width:44px;height:64px;margin-top:-32px}.arr svg{width:18px;height:36px}}
.slide{position:absolute;inset:0;overflow:hidden;transform:translateX(100%);will-change:transform}
.slide::before{content:"";position:absolute;inset:-8%;background-image:var(--img);background-size:cover;background-position:center;filter:blur(28px) saturate(1.1) brightness(.3);display:none}
@media (max-aspect-ratio:1/1){
  .slide::before{display:block}
  .slide::before{filter:blur(26px) saturate(1.15) brightness(.42)}
  .hero .slide .bg{inset:0;background-size:auto 64%;background-repeat:no-repeat;background-position:30% 46%;animation:pan 38s ease-in-out infinite alternate;filter:saturate(1.15) brightness(.42) blur(1.5px);
    -webkit-mask-image:linear-gradient(transparent 6%,#000 22%,#000 70%,transparent 90%);mask-image:linear-gradient(transparent 6%,#000 22%,#000 70%,transparent 90%)}
  .hero::after{background:radial-gradient(ellipse 120% 70% at center,transparent 30%,rgba(7,8,13,.7) 100%),linear-gradient(transparent 70%,var(--bg))}
}
.slide.go{transition:transform 1s cubic-bezier(.65,0,.25,1)}
.hero .bg{position:absolute;inset:-4%;background-size:cover;background-position:center;filter:saturate(1.15) brightness(.4) blur(1.5px);animation:drift 30s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,var(--bg) 85%),linear-gradient(transparent 60%,var(--bg))}
.hero .in{position:relative;z-index:2;padding:0 16px}
.kicker span{white-space:nowrap}
.kicker{color:var(--gold);letter-spacing:.5em;font-size:13px;text-transform:uppercase;opacity:0;animation:up 1.2s .2s forwards}
.hero h1{font-size:clamp(64px,13vw,170px);font-weight:800;line-height:.95;margin:18px 0;background:linear-gradient(180deg,#fff6dc,#f0c060 55%,#b8742a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(240,160,60,.35));opacity:0;animation:up 1.4s .5s forwards}
.hero .sub{font-size:clamp(16px,2.2vw,22px);line-height:1.5;max-width:640px;margin:0 auto;opacity:0;animation:up 1.4s .9s forwards}
.punch{display:flex;flex-direction:column;gap:22px;margin-top:34px}
.punch div{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px);animation:punch 1s cubic-bezier(.2,.8,.2,1) forwards}
.punch div:nth-child(1){animation-delay:1.1s}.punch div:nth-child(2){animation-delay:1.9s}.punch div:nth-child(3){animation-delay:2.7s}
.punch b{display:block;font-family:Cinzel,Georgia,serif;font-weight:800;font-size:clamp(24px,3.6vw,44px);letter-spacing:.05em;color:#fff3d6;text-shadow:0 0 28px rgba(240,160,60,.45),0 3px 16px #000}
.punch em{display:block;max-width:560px;margin:10px auto 0;font-style:normal;font-size:clamp(14px,1.25vw,17px);line-height:1.55;color:#d9cfbb;text-shadow:0 2px 10px #000}
.punch small span{white-space:nowrap}
.punch small{display:block;margin-top:6px;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
@keyframes punch{60%{filter:blur(0);text-shadow:none}to{opacity:1;transform:none;filter:blur(0)}}
.stats{display:flex;gap:34px;justify-content:center;margin-top:36px;flex-wrap:wrap;opacity:0;animation:up 1.4s 1.2s forwards}
.stats div{font-family:Cinzel,serif;font-size:28px;color:var(--gold)}
.stats small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:4px}
/* A scene: the screenshot at its own 1920x1080 (never cropped, never enlarged),
   its edges dissolving into fog made of a blurred copy of itself and drifting clouds. */
.shot{position:relative;overflow:hidden;cursor:zoom-in;padding:9vh 0;isolation:isolate}
.shot .blur{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.2) brightness(.42);z-index:-3}
.shot.night .blur{filter:blur(60px) saturate(.9) brightness(.32) hue-rotate(10deg)}
.shot::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(var(--bg),transparent 16%,transparent 84%,var(--bg))}
.stage{position:relative;width:min(1920px,100%);margin:0 auto;aspect-ratio:16/9}
.pic{display:block;width:100%;height:auto;image-rendering:auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(180deg,transparent 0,#000 11%,#000 89%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(180deg,transparent 0,#000 11%,#000 89%,transparent 100%)}
.clouds{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.shot .shade{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(180deg,transparent 0,#000 11%,#000 89%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect;mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(180deg,transparent 0,#000 11%,#000 89%,transparent 100%)}
.shot.l .shade{background:linear-gradient(90deg,rgba(7,8,13,.85) 0%,rgba(7,8,13,.45) 30%,transparent 52%)}
.shot.r .shade{background:linear-gradient(270deg,rgba(7,8,13,.85) 0%,rgba(7,8,13,.45) 30%,transparent 52%)}
.cap{position:absolute;top:50%;transform:translateY(-40%);max-width:440px;opacity:0;transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none;z-index:2}
.shot.l .cap{left:max(24px,7%)}
.shot.r .cap{right:max(24px,7%);text-align:right}
.shot.seen .cap{opacity:1;transform:translateY(-50%)}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:11px;letter-spacing:.35em;text-transform:uppercase;padding:6px 12px;background:rgba(7,8,13,.5)}
.cap h2{font-size:clamp(34px,5vw,64px);line-height:1.04;margin:18px 0 14px;text-shadow:0 4px 30px #000}
.cap p{font-size:clamp(15px,1.4vw,18px);line-height:1.6;color:#e2d8c4;text-shadow:0 2px 12px #000}
.num{display:block;margin-top:22px;color:var(--dim);font-size:12px;letter-spacing:.3em}
.gallery{padding:12vh 16px 6vh;max-width:1500px;margin:0 auto}
.gallery>h2{text-align:center;font-size:clamp(30px,4.5vw,54px)}
.gallery>p{text-align:center;color:var(--dim);margin:12px auto 0;max-width:620px;line-height:1.6}
.acthead{text-align:center;margin:10vh 0 28px}
.acthead span{color:var(--ember);letter-spacing:.5em;font-size:12px;text-transform:uppercase}
.acthead h3{font-size:clamp(26px,3.4vw,40px);margin:10px 0 8px}
.acthead p{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
figure{position:relative;overflow:hidden;border-radius:6px;cursor:zoom-in;background:#111;aspect-ratio:16/9;margin:0}
figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,filter .5s;filter:brightness(.85)}
figure:hover img{transform:scale(1.06);filter:brightness(1.05)}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;font-size:12px;color:var(--dim);background:linear-gradient(transparent,rgba(0,0,0,.85))}
figcaption b{color:var(--gold);margin-right:6px}
.box{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;place-items:center;z-index:9;cursor:zoom-out}
.box.on{display:grid}
.box img{max-width:96vw;max-height:92vh;box-shadow:0 0 80px rgba(240,160,60,.15)}
.box .nav{position:fixed;top:50%;transform:translateY(-50%);font-size:52px;color:var(--ink);padding:20px;cursor:pointer;user-select:none;opacity:.6}
.box .nav:hover{opacity:1}
.box .p{left:8px}.box .n{right:8px}
.sky{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:8vh 16px 7vh;
  background:radial-gradient(ellipse 90% 60% at 50% 115%,rgba(70,96,160,.32),transparent 70%),linear-gradient(var(--bg) 0%,#0c1630 22%,#0c1630 72%,#0a1128 100%)}
.stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-6vh;height:34vh;pointer-events:none;
  background:radial-gradient(ellipse 30% 55% at 18% 70%,rgba(190,205,240,.13),transparent 70%),radial-gradient(ellipse 34% 60% at 55% 80%,rgba(190,205,240,.11),transparent 70%),radial-gradient(ellipse 28% 50% at 88% 72%,rgba(190,205,240,.12),transparent 70%);
  filter:blur(18px);animation:mist 26s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(4%)}}
.sky .in{position:relative;z-index:1;width:100%;max-width:1760px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,40px);margin:0 auto 7vh;text-align:center}
.duo figure{margin:0;cursor:zoom-in;aspect-ratio:auto;background:none;border-radius:0;overflow:visible;position:static}
.duo .frame{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#0a1022;
  box-shadow:0 0 0 1px rgba(240,192,96,.22),0 30px 60px -20px rgba(0,0,0,.8),0 0 80px -30px rgba(120,150,230,.35);transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.duo figure:hover .frame{transform:translateY(-6px);box-shadow:0 0 0 1px rgba(240,192,96,.6),0 40px 70px -20px rgba(0,0,0,.85),0 0 90px -25px rgba(240,192,96,.35)}
.duo img{display:block;width:100%;height:100%;object-fit:cover;filter:none;transition:none}
.duo figure:hover img{transform:none;filter:none}
.duo figcaption{position:static;background:none;padding:18px 2px 0;font-family:Cinzel,Georgia,serif;font-size:clamp(18px,1.6vw,24px);color:#f3ead7;letter-spacing:.04em}
.duo figcaption span{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
@media (max-width:760px){.duo{grid-template-columns:1fr;gap:36px}}
.sky b{font-family:Cinzel,serif;font-weight:800;font-size:clamp(40px,6vw,72px);letter-spacing:.14em;display:block;background:linear-gradient(180deg,#fff6dc,#f0c060 60%,#b8742a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(240,160,60,.3))}
.call{margin-top:0;color:var(--gold);font-size:12px;letter-spacing:.5em;text-transform:uppercase}
.social{display:flex;gap:26px;justify-content:center;margin:28px 0 40px}
.social a{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#e9eefc;border:1px solid rgba(233,238,252,.22);background:rgba(233,238,252,.05);transition:transform .3s,color .3s,border-color .3s,box-shadow .3s}
.social a:hover{transform:translateY(-4px);color:#fff;border-color:rgba(240,192,96,.8);box-shadow:0 0 28px rgba(240,192,96,.35)}
.social a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.social svg{width:30px;height:30px}
.social a{position:relative}
.soon{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translate(-50%,6px);white-space:nowrap;pointer-events:none;
  font-family:Cinzel,Georgia,serif;font-weight:600;font-size:15px;letter-spacing:.08em;color:#fff3d6;
  padding:8px 14px;border-radius:6px;background:rgba(12,22,48,.92);border:1px solid rgba(240,192,96,.55);box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0;transition:opacity .25s,transform .25s}
.soon::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(240,192,96,.55)}
.soon.on{opacity:1;transform:translate(-50%,0)}
.contact{color:var(--dim);font-size:11px;letter-spacing:.45em;text-transform:uppercase}
.mail{display:inline-block;margin-top:10px;color:#f3ead7;font-size:clamp(16px,1.6vw,20px);text-decoration:none;border-bottom:1px solid rgba(240,192,96,.4);padding-bottom:3px;transition:color .25s,border-color .25s}
.mail:hover{color:var(--gold);border-color:var(--gold)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pan{from{background-position:30% 46%}to{background-position:70% 46%}}
@keyframes drift{from{transform:scale(1.02) translateX(-1%)}to{transform:scale(1.1) translateX(1%)}}
@keyframes bob{50%{transform:translate(-50%,8px)}}
@media (max-width:900px){
  .punch small{letter-spacing:.14em;font-size:11px}
  .kicker{letter-spacing:.3em;font-size:11px}
  .shot{padding:5vh 0 3vh}
  .shot .shade{display:none}
  .stage{aspect-ratio:auto}
  .shot .cap,.shot.seen .cap{position:relative;top:auto;left:auto!important;right:auto!important;text-align:left!important;transform:none;max-width:none;padding:22px 16px 20px;margin:14px 12px 0;background:rgba(7,8,13,.78);border-radius:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .kicker,.hero h1,.punch div,.cap{opacity:1;filter:none;transform:none}
}
</style>
</head>
<body>
<header class="hero">
  <div class="bgs" id="bgs"></div>
  <div class="in">
    <div class="kicker"><span>Multiplayer MOBA</span> &middot; <span>1v1 to six-way free-for-all</span></div>
    <h1>LANE</h1>
    <div class="punch">
      <div><b>3 heroes. All you.</b><small>Control your whole team</small></div>
      <div><b>Skill wins. Not levels.</b><small><span>No hero leveling</span> &middot; <span>No feeding</span> &middot; <span>No snowball</span></small></div>
      <div><b>10 minutes. One crown.</b><small>Fast matches, no grind</small></div>
    </div>
  </div>
</header>


<footer class="sky" id="below">
  <canvas class="stars" id="stars"></canvas>
  <div class="in">
    <div class="duo">
      <figure data-i="0"><div class="frame"><img alt="First Blood of the Wild: the squad clears its first camp under the night fog"></div></figure>
      <figure data-i="1"><div class="frame"><img alt="Fire in the Ruins: a bomb bursts between three heroes in a broken fortress"></div></figure>
    </div>
    <p class="call">Join the war</p>
    <nav class="social" aria-label="Lane elsewhere">
      <a href="#" aria-label="Steam" title="Steam"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="currentColor"/><g fill="none" stroke="#0b1430" stroke-linecap="round"><circle cx="15.6" cy="8.9" r="3.1" stroke-width="1.6"/><path d="M13.2 10.9 8.6 14.3" stroke-width="2.3"/><circle cx="8.1" cy="15" r="2.3" stroke-width="1.6"/></g><circle cx="15.6" cy="8.9" r="1.3" fill="#0b1430"/></svg></a>
      <a href="#" aria-label="Discord" title="Discord"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4.9 6.2c1.9-1.3 3.9-1.8 4.7-1.9l.5 1c1.3-.2 2.6-.2 3.8 0l.5-1c.8.1 2.8.6 4.7 1.9 2 3 2.9 6.3 2.6 10.1-1.7 1.3-3.5 2.1-5.1 2.5l-1.1-1.8c.8-.3 1.6-.7 2.3-1.2-3.5 1.7-7.6 1.7-11.1 0 .7.5 1.5.9 2.3 1.2l-1.1 1.8c-1.6-.4-3.4-1.2-5.1-2.5-.3-3.8.6-7.1 2.6-10.1z"/><ellipse cx="9" cy="12.4" rx="1.6" ry="1.8" fill="#0b1430"/><ellipse cx="15" cy="12.4" rx="1.6" ry="1.8" fill="#0b1430"/></svg></a>
      <a href="#" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg></a>
    </nav>
    <p class="contact">Contact</p>
    <a class="mail" href="mailto:ofekgamestudio@gmail.com">ofekgamestudio@gmail.com</a>
  </div>
</footer>
<div class="box" id="box"><span class="nav p" id="pv">&#8249;</span><img id="bi" alt=""><span class="nav n" id="nx">&#8250;</span></div>
<script>
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('seen'); }), { threshold: .35 });
document.querySelectorAll('.shot').forEach(s => io.observe(s));

// Drifting cloud puffs round each picture: thick outside it, thinning to a
// haze over its rim, clear over the middle. Only the scenes on screen animate.
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // A billowy cloud: a cluster of soft lobes, lit a little from above.
  const sprite = (r, g, b, seed) => {
    let q = seed * 9301 + 49297; const rnd = () => (q = (q * 9301 + 49297) % 233280) / 233280;
    const c = document.createElement('canvas'); c.width = 512; c.height = 340;
    const x = c.getContext('2d');
    const lobes = 9 + Math.floor(rnd() * 6);
    for(let i = 0; i < lobes; i++){
      const t = i / lobes, cx = 150 + t * 212 + (rnd() - .5) * 30, cy = 215 - Math.sin(t * Math.PI) * (35 + rnd() * 25) + (rnd() - .5) * 14;
      const rad = 40 + rnd() * 35 + Math.sin(t * Math.PI) * 30;
      const gr = x.createRadialGradient(cx, cy - rad * .25, 0, cx, cy, rad);
      gr.addColorStop(0, `rgba(${Math.min(255, r + 12)},${Math.min(255, g + 12)},${Math.min(255, b + 10)},.95)`);
      gr.addColorStop(.55, `rgba(${r},${g},${b},.6)`);
      gr.addColorStop(1, `rgba(${r - 30},${g - 30},${b - 25},0)`);
      x.fillStyle = gr; x.beginPath(); x.arc(cx, cy, rad, 0, 6.2832); x.fill();
    }
    return c;
  };
  const SPR = { night: [1,2,3,4].map(k => sprite(206, 216, 238, k)), day: [1,2,3,4].map(k => sprite(244, 238, 224, k)) };
  const scenes = [...document.querySelectorAll('.shot')].map(sec => {
    const cv = sec.querySelector('.clouds'), ctx = cv.getContext('2d');
    const S = { sec, cv, ctx, spr: SPR[sec.classList.contains('night') ? 'night' : 'day'], puffs: [], on: false, W: 0, H: 0, r: null };
    return S;
  });
  function layout(S){
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    const W = S.sec.clientWidth, H = S.sec.clientHeight;
    S.cv.width = Math.round(W * dpr); S.cv.height = Math.round(H * dpr);
    S.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const st = S.sec.querySelector('.pic').getBoundingClientRect(), sr = S.sec.getBoundingClientRect();
    const r = { x: st.left - sr.left, y: st.top - sr.top, w: st.width, h: st.height };
    const changed = !S.r || S.W !== W || S.H !== H;
    S.W = W; S.H = H; S.r = r;
    if(changed){
      // Puffs: most along the picture's rim, the rest out in the margins.
      const n = Math.round(Math.min(120, 40 + (W * H) / 40000));
      S.puffs = [];
      for(let i = 0; i < n; i++){
        let x, y;
        if(Math.random() < .72){
          const side = Math.random() * (2 * r.w + 2 * r.h);
          const j = (Math.random() - .5) * Math.max(120, r.w * .16);
          if(side < r.w){ x = r.x + side; y = r.y + j; }
          else if(side < 2 * r.w){ x = r.x + side - r.w; y = r.y + r.h + j; }
          else if(side < 2 * r.w + r.h){ x = r.x + j; y = r.y + side - 2 * r.w; }
          else { x = r.x + r.w + j; y = r.y + side - 2 * r.w - r.h; }
        } else { x = Math.random() * W; y = Math.random() * H; }
        S.puffs.push({ x, y, s: 110 + Math.random() * 230 * Math.max(.6, r.w / 1920), a: .22 + Math.random() * .3, k: Math.floor(Math.random() * 4),
                       vx: (Math.random() < .5 ? -1 : 1) * (4 + Math.random() * 10), vy: (Math.random() - .5) * 3,
                       ph: Math.random() * 6.28 });
      }
    }
  }
  function draw(S, dt, t){
    const { ctx, W, H, r } = S;
    ctx.clearRect(0, 0, W, H);
    const m = Math.max(50, r.w * .09);          // how far into the picture the rim haze reaches
    for(const p of S.puffs){
      p.x += p.vx * dt; p.y += p.vy * dt;
      if(p.x < -p.s) p.x = W + p.s; if(p.x > W + p.s) p.x = -p.s;
      if(p.y < -p.s) p.y = H + p.s; if(p.y > H + p.s) p.y = -p.s;
      // distance inside the picture's clear middle: 0 at its rim
      const inX = Math.min(p.x - r.x, r.x + r.w - p.x), inY = Math.min(p.y - r.y, r.y + r.h - p.y);
      const inside = Math.min(inX, inY);
      const reach = inside + p.s * .75;           // how far the cloud's body reaches into the picture
      const f = reach <= 0 ? 1 : Math.max(0, 1 - reach / m);
      if(f <= .01) continue;
      const s = p.s * (1 + .06 * Math.sin(t * .0004 + p.ph));
      ctx.globalAlpha = p.a * f;
      ctx.drawImage(S.spr[p.k], p.x - s * 1.5, p.y - s, s * 3, s * 2);
    }
    ctx.globalAlpha = 1;
  }
  const vis = new IntersectionObserver(es => es.forEach(e => { const S = scenes.find(q => q.sec === e.target); S.on = e.isIntersecting; }), { rootMargin: '200px' });
  scenes.forEach(S => { layout(S); draw(S, 0, 0); vis.observe(S.sec); });
  addEventListener('resize', () => scenes.forEach(S => { layout(S); draw(S, 0, performance.now()); }));
  let last = performance.now();
  function frame(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if(!reduce) for(const S of scenes) if(S.on) draw(S, dt, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// The night sky at the bottom: twinkling stars and a few golden sparks rising.
(function(){
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, stars = [], sparks = [], on = false, builtW = 0;
  function spark(any){ return { x: Math.random() * W, y: any ? H * (.2 + Math.random() * .8) : H + 10, v: 12 + Math.random() * 22, drift: (Math.random() - .5) * 10, r: .8 + Math.random() * 1.4 }; }
  function size(){
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(W === builtW && stars.length) return;
    builtW = W;
    const n = Math.round(W * H / 5200);
    stars = Array.from({ length: n }, () => ({ fx: Math.random(), fy: Math.random() * .85, r: Math.random() < .08 ? 1.3 + Math.random() : .4 + Math.random() * .8,
      a: .35 + Math.random() * .6, tw: .6 + Math.random() * 2, ph: Math.random() * 6.28 }));
    sparks = Array.from({ length: 14 }, () => spark(true));
  }
  function draw(t, dt){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#eef2ff';
    for(const s of stars){
      const a = s.a * (reduce ? 1 : .55 + .45 * Math.sin(t * .001 * s.tw + s.ph));
      ctx.globalAlpha = a;
      const x = s.fx * W, y = s.fy * H;
      ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.2832); ctx.fill();
      if(s.r > 1.3){ ctx.globalAlpha = a * .22; ctx.beginPath(); ctx.arc(x, y, s.r * 3.2, 0, 6.2832); ctx.fill(); }
    }
    for(let i = 0; i < sparks.length; i++){
      const p = sparks[i];
      if(!reduce){ p.y -= p.v * dt; p.x += p.drift * dt; }
      if(p.y < H * .15){ sparks[i] = spark(false); continue; }
      const fade = Math.max(0, Math.min(1, (p.y - H * .15) / (H * .3)));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, 'rgba(255,245,210,1)'); g.addColorStop(.3, 'rgba(255,205,100,.7)'); g.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.globalAlpha = .8 * fade; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#eef2ff';
    }
    ctx.globalAlpha = 1;
  }
  new IntersectionObserver(es => { on = es[0].isIntersecting; }).observe(cv);
  size(); draw(0, 0);
  addEventListener('resize', () => { size(); draw(performance.now(), 0); });
  let last = performance.now();
  (function frame(t){ const dt = Math.min(.05, Math.max(0, (t - last) / 1000)); last = t; if(on) draw(t, dt); requestAnimationFrame(frame); })(last);
})();

// Two stops, the title and the area below it: one wheel turn (or Page Down,
// Space, an arrow key) glides the whole way; touch scrolls as it always does.
(function(){
  const below = document.getElementById('below');
  let gliding = false;
  const target = () => below.offsetTop;
  function glide(y){
    gliding = true;
    scrollTo({ top: y, behavior: 'smooth' });
    const t0 = performance.now();
    (function wait(){
      if(Math.abs(scrollY - y) < 2 || performance.now() - t0 > 1500){ gliding = false; return; }
      requestAnimationFrame(wait);
    })();
  }
  function step(dir, e){
    const y = scrollY, top = target();
    if(dir > 0 && y < top - 2){ e.preventDefault(); if(!gliding) glide(top); }
    else if(dir < 0 && y > 2 && y <= top + 2){ e.preventDefault(); if(!gliding) glide(0); }
    else if(gliding) e.preventDefault();
  }
  addEventListener('wheel', e => {
    if(e.ctrlKey || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
    step(Math.sign(e.deltaY), e);
  }, { passive: false });
  addEventListener('keydown', e => {
    if(document.getElementById('box').classList.contains('on')) return;
    const down = e.key === 'PageDown' || e.key === 'ArrowDown' || (e.key === ' ' && !e.shiftKey);
    const up = e.key === 'PageUp' || e.key === 'ArrowUp' || (e.key === ' ' && e.shiftKey);
    if(down) step(1, e); else if(up) step(-1, e);
  });
})();

    e.preventDefault();
    tip.classList.add('on');
    clearTimeout(tip.t);
    tip.t = setTimeout(() => tip.classList.remove('on'), 1800);
  });
});
</script>
</body>
</html>
